<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SoundCloud RPC</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #14161a;
      color: #f3f4f6;
      font-size: 13px;
    }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .card { background: #1e1f22; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
    input[type="url"], textarea {
      width: 100%; box-sizing: border-box; background: #262930; color: #fff;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 7px; font-size: 12px;
    }
    .now-title { font-weight: 700; color: #fff; }
    .now-artist { font-size: 12px; color: #b5bac1; margin-top: 2px; }
    .orange { color: #ff5500; }
    .muted { color: #9ca3af; font-size: 11px; }
  </style>
</head>
<body>
  <h1><span class="orange">☁️</span> SoundCloud RPC</h1>

  <div class="card" id="nowCard">
    <div class="muted">Open soundcloud.com and play a track</div>
  </div>

  <label class="row"><span>🛡️ AdBlocker (30 network + CSS rules)</span><input type="checkbox" id="adBlocker" checked /></label>
  <label class="row"><span>🌙 Dark Mode</span><input type="checkbox" id="darkMode" checked /></label>
  <label class="row"><span>✂️ Smart Track Parser</span><input type="checkbox" id="trackParser" checked /></label>
  <label class="row"><span>🔔 Enable Webhooks</span><input type="checkbox" id="webhookEnabled" /></label>

  <div style="margin-top:8px;">
    <input type="url" id="webhookUrl" placeholder="Webhook URL (Custom or Discord)" />
  </div>

  <div style="margin-top:10px;">
    <div class="muted" style="margin-bottom:4px;">Custom Theme CSS (live injected):</div>
    <textarea id="customCSS" rows="3" placeholder="/* Custom CSS for soundcloud.com */"></textarea>
  </div>

  <script src="popup.js"></script>
</body>
</html>
