name: SoundCloudRPC
options:
  bundleIdPrefix: com.soundcloudrpc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "10"

targets:
  SoundCloudRPC:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SoundCloudRPC
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: SoundCloudRPC/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.soundcloudrpc.mobile
        PRODUCT_NAME: SoundCloudRPC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
