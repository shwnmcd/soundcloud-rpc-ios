name: Build CloudWave

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Portable Windows App
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Verify Output
        working-directory: desktop
        shell: pwsh
        run: Get-ChildItem dist\*.exe

      - name: Upload CloudWave-Windows
        uses: actions/upload-artifact@v4
        with:
          name: CloudWave-Windows
          path: desktop/dist/CloudWave.exe
          retention-days: 30

  build-ios:
    name: Build iOS & iPadOS (AltStore)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned Release App
        working-directory: ios
        run: |
          xcodebuild \
            -project SoundCloudRPC.xcodeproj \
            -scheme SoundCloudRPC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package CloudWave.ipa
        working-directory: ios
        run: |
          mkdir -p dist/Payload
          cp -r build/Build/Products/Release-iphoneos/SoundCloudRPC.app dist/Payload/
          cd dist
          zip -r -y CloudWave.ipa Payload
          ls -lh CloudWave.ipa

      - name: Upload CloudWave-iOS
        uses: actions/upload-artifact@v4
        with:
          name: CloudWave-iOS
          path: ios/dist/CloudWave.ipa
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Package CloudWave.apk
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CloudWave.apk
          ls -lh dist/CloudWave.apk

      - name: Upload CloudWave-Android
        uses: actions/upload-artifact@v4
        with:
          name: CloudWave-Android
          path: android/dist/CloudWave.apk
          retention-days: 30
