name: Build SoundCloud S

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows Installer (Choose Folder + Uninstaller)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Verify Output
        working-directory: desktop
        shell: pwsh
        run: Get-ChildItem dist\*.exe

      - name: Upload SoundCloud-S-Windows
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-S-Windows
          path: desktop/dist/SoundCloud-S-Setup.exe
          retention-days: 30

  build-ios:
    name: Build iOS & iPadOS (AltStore)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned Release App
        working-directory: ios
        run: |
          xcodebuild \
            -project SoundCloudRPC.xcodeproj \
            -scheme SoundCloudRPC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package SoundCloud-S.ipa
        working-directory: ios
        run: |
          mkdir -p dist/Payload
          cp -r build/Build/Products/Release-iphoneos/SoundCloudRPC.app dist/Payload/
          cd dist
          zip -r -y SoundCloud-S.ipa Payload
          ls -lh SoundCloud-S.ipa

      - name: Upload SoundCloud-S-iOS
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-S-iOS
          path: ios/dist/SoundCloud-S.ipa
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Package SoundCloud-S.apk
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SoundCloud-S.apk
          ls -lh dist/SoundCloud-S.apk

      - name: Upload SoundCloud-S-Android
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-S-Android
          path: android/dist/SoundCloud-S.apk
          retention-days: 30

  publish-release:
    name: Publish Auto-Update Release & AltStore Source
    needs: [build-windows, build-ios, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate AltStore Source JSON & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          BUILD_NUM=$(grep -oE 'CURRENT_PROJECT_VERSION: "[0-9]+"' ios/project.yml | grep -oE '[0-9]+' || echo "1")
          IPA_PATH="release-artifacts/SoundCloud-S-iOS/SoundCloud-S.ipa"
          EXE_PATH="release-artifacts/SoundCloud-S-Windows/SoundCloud-S-Setup.exe"
          APK_PATH="release-artifacts/SoundCloud-S-Android/SoundCloud-S.apk"
          IPA_SIZE=$(stat -c%s "$IPA_PATH")
          ISO_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${GITHUB_REPOSITORY}"

          cat > altstore-source.json <<EOF
          {
            "name": "SoundCloud S",
            "identifier": "com.soundclouds.source",
            "subtitle": "Ad-free SoundCloud with Jam, Arcade Games & VFD Visualizer",
            "description": "Official auto-update AltStore source for SoundCloud S (based on SoundCloud RPC by richardhbtz).",
            "website": "https://github.com/${REPO}",
            "tintColor": "#FF5500",
            "apps": [
              {
                "name": "SoundCloud S",
                "bundleIdentifier": "com.soundcloudrpc.mobile",
                "developerName": "SoundCloud S",
                "subtitle": "Ad-free SoundCloud · Jam · Connect 4, Chess & 21",
                "localizedDescription": "Native ad-free SoundCloud client for iPhone & iPad with two-way sync, custom themes, vinyl player, worldwide Group Jam, multiplayer Connect Four, Chess & 21 Blackjack, and VFD spectrum visualizer. Based on SoundCloud RPC (MIT).",
                "tintColor": "#FF5500",
                "versions": [
                  {
                    "version": "${VERSION}",
                    "buildVersion": "${BUILD_NUM}",
                    "date": "${ISO_DATE}",
                    "localizedDescription": "SoundCloud S ${TAG} — automatic in-place updates, direct SoundCloud sync, and multiplayer Jam Arcade.",
                    "downloadURL": "https://github.com/${REPO}/releases/download/${TAG}/SoundCloud-S.ipa",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "16.0"
                  }
                ],
                "appPermissions": {
                  "entitlements": [],
                  "privacy": {}
                }
              }
            ],
            "news": []
          }
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE_PATH" "$IPA_PATH" "$APK_PATH" altstore-source.json --clobber
          else
            gh release create "$TAG" "$EXE_PATH" "$IPA_PATH" "$APK_PATH" altstore-source.json \
              --title "SoundCloud S ${TAG}" \
              --notes "SoundCloud S ${TAG} — automatic in-place updates for Windows, iOS (AltStore Source), and Android." \
              --latest
          fi
