name: Build Windows (EXE), iOS (IPA) & Android (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop (EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Portable Windows EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Verify EXE Output
        working-directory: desktop
        shell: pwsh
        run: Get-ChildItem dist\*.exe

      - name: Upload SoundCloudRPC-Windows.exe
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloudRPC-Windows-EXE
          path: desktop/dist/SoundCloudRPC-Windows.exe
          retention-days: 30

  build-ios:
    name: Build iOS & iPadOS (AltStore IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned Release App
        working-directory: ios
        run: |
          xcodebuild \
            -project SoundCloudRPC.xcodeproj \
            -scheme SoundCloudRPC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p dist/Payload
          cp -r build/Build/Products/Release-iphoneos/SoundCloudRPC.app dist/Payload/
          cd dist
          zip -r -y SoundCloudRPC.ipa Payload
          ls -lh SoundCloudRPC.ipa

      - name: Upload SoundCloudRPC.ipa (AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloudRPC-iOS-IPA
          path: ios/dist/SoundCloudRPC.ipa
          retention-days: 30

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Package SoundCloudRPC.apk
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SoundCloudRPC.apk
          ls -lh dist/SoundCloudRPC.apk

      - name: Upload SoundCloudRPC.apk (Android)
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloudRPC-Android-APK
          path: android/dist/SoundCloudRPC.apk
          retention-days: 30
